<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração Presidente 2026</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --txt: #16202c; --sub: #5b6676; --line: #e1e6ed;
    --a: #c8102e; --b: #1f4fbf; --ok: #138a43;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141b; --card: #18202b; --txt: #eef2f7; --sub: #9aa6b6; --line: #2a3442; --a: #ff4d63; --b: #5b8cff; --ok: #34c46e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
  .prog-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .6s; }
  .cand { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .cand:first-child { border-top: 0; }
  .foto { width: 64px; height: 64px; border-radius: 50%; background: var(--line); object-fit: cover; }
  .nome { font-weight: 700; font-size: 18px; }
  .partido { color: var(--sub); font-size: 13px; }
  .pct { font-size: 30px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .votos { color: var(--sub); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .cbar { grid-column: 1 / -1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .cbar > div { height: 100%; transition: width .6s; }
  .eleito { display: inline-block; background: var(--ok); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid div { background: var(--bg); border-radius: 10px; padding: 10px; }
  .grid b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .grid span { color: var(--sub); font-size: 12px; }
  .status { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; animation: pisca 1.4s infinite; }
  .erro { color: var(--a); }
  @keyframes pisca { 50% { opacity: .25; } }
  button { background: var(--txt); color: var(--bg); border: 0; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

  .abas { display: flex; gap: 6px; margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .abas button { flex: 1; background: transparent; color: var(--sub); font-size: 15px; font-weight: 600; padding: 10px; }
  .abas button.ativa { background: var(--txt); color: var(--bg); }
  .placar { display: flex; gap: 10px; flex-wrap: wrap; }
  .placar div { flex: 1; min-width: 140px; background: var(--bg); border-radius: 10px; padding: 10px; border-left: 5px solid; }
  .placar b { display: block; font-size: 22px; }
  .placar span { color: var(--sub); font-size: 12px; }
  .ordem { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--sub); }
  .ordem select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--txt); }
  .uf { padding: 12px 0; border-top: 1px solid var(--line); }
  .uf:first-child { border-top: 0; }
  .uf-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .uf-nome { font-weight: 700; }
  .uf-nome small { color: var(--sub); font-weight: 400; margin-left: 4px; }
  .uf-apur { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 8px 0 6px; }
  .split div { height: 100%; transition: width .6s; }
  .uf-pcts { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .uf-pcts span b { font-size: 15px; }
  .uf-sem { color: var(--sub); font-size: 13px; margin-top: 6px; }
  .reg { padding: 16px 0; border-top: 1px solid var(--line); }
  .reg:first-child { border-top: 0; padding-top: 0; }
  .reg-nome { font-size: 18px; font-weight: 700; }
  .reg-ufs { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .reg-cands { display: flex; justify-content: space-between; gap: 8px; }
  .reg-cands div:last-child { text-align: right; }
  .reg-cands b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .reg-cands span { color: var(--sub); font-size: 12px; font-variant-numeric: tabular-nums; }
  .reg-dif { font-size: 13px; margin-top: 6px; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .cand { grid-template-columns: 48px 1fr auto; }
    .foto { width: 48px; height: 48px; }
    .pct { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <h1>Apuração – Presidente 2026 (2º turno)</h1>
  <div class="sub">Dados oficiais do TSE · atualiza sozinho</div>

  <nav class="abas">
    <button id="abaBr" class="ativa">Brasil</button>
    <button id="abaUf">Por estado</button>
    <button id="abaReg">Por região</button>
  </nav>

  <div id="telaBr">
    <section class="card">
      <div class="prog-top">
        <span class="sub">Urnas apuradas</span>
        <span class="big" id="pst">–</span>
      </div>
      <div class="bar"><div id="pstBar"></div></div>
      <div class="sub" id="secoes" style="margin-top:8px">&nbsp;</div>
    </section>

    <section class="card" id="cands"><div class="sub">Carregando dados do TSE…</div></section>

    <section class="card">
      <div class="grid">
        <div><b id="vv">–</b><span>Votos válidos</span></div>
        <div><b id="vb">–</b><span>Brancos</span></div>
        <div><b id="vn">–</b><span>Nulos</span></div>
        <div><b id="te">–</b><span>Eleitores</span></div>
        <div><b id="c">–</b><span>Compareceram</span></div>
        <div><b id="a">–</b><span>Abstenção</span></div>
      </div>
    </section>
  </div>

  <div id="telaUf" hidden>
    <section class="card">
      <div class="placar" id="placar"><span class="sub">Carregando estados…</span></div>
      <div class="ordem">
        Ordenar por
        <select id="ordem">
          <option value="eleitores">Mais eleitores</option>
          <option value="nome">Nome do estado</option>
          <option value="diferenca">Disputa mais apertada</option>
          <option value="apuradas">Mais urnas apuradas</option>
        </select>
      </div>
    </section>
    <section class="card" id="ufs"></section>
  </div>

  <div id="telaReg" hidden>
    <section class="card" id="regioes"><div class="sub">Carregando regiões…</div></section>
  </div>

  <div class="status">
    <span id="status"><span class="dot"></span>Conectando…</span>
    <span>Próxima atualização em <b id="conta">15</b>s <button id="agora">Atualizar agora</button></span>
  </div>
</main>

<script>
  // 2º turno = 6258 · 1º turno = 6257 (pode trocar pela URL: apuracao.html?eleicao=6257)
  const ELEICAO = new URLSearchParams(location.search).get("eleicao") || "6258";
  const COD = String(ELEICAO).padStart(6, "0");
  const BASE = `https://resultados.tse.jus.br/oficial/ele2026/${ELEICAO}`;
  const INTERVALO_BR = 15;
  const INTERVALO_UF = 60; // são 27 arquivos, então os estados atualizam com menos pressa
  const CORES = ["var(--a)", "var(--b)", "#8a5cf6", "#e08a00"];
  const ESTADOS = {
    ac: "Acre", al: "Alagoas", ap: "Amapá", am: "Amazonas", ba: "Bahia", ce: "Ceará", df: "Distrito Federal",
    es: "Espírito Santo", go: "Goiás", ma: "Maranhão", mt: "Mato Grosso", ms: "Mato Grosso do Sul",
    mg: "Minas Gerais", pa: "Pará", pb: "Paraíba", pr: "Paraná", pe: "Pernambuco", pi: "Piauí",
    rj: "Rio de Janeiro", rn: "Rio Grande do Norte", rs: "Rio Grande do Sul", ro: "Rondônia", rr: "Roraima",
    sc: "Santa Catarina", sp: "São Paulo", se: "Sergipe", to: "Tocantins",
  };
  const REGIOES = {
    "Norte": ["ac", "ap", "am", "pa", "ro", "rr", "to"],
    "Nordeste": ["al", "ba", "ce", "ma", "pb", "pe", "pi", "rn", "se"],
    "Centro-Oeste": ["df", "go", "mt", "ms"],
    "Sudeste": ["es", "mg", "rj", "sp"],
    "Sul": ["pr", "rs", "sc"],
  };

  const $ = (id) => document.getElementById(id);
  const num = (v) => {
    if (typeof v === "number") return v;
    const s = String(v ?? "").trim();
    if (!s) return 0;
    return s.includes(",") ? parseFloat(s.replace(/\./g, "").replace(",", ".")) : parseFloat(s);
  };
  const fmt = (n) => Math.round(n || 0).toLocaleString("pt-BR");
  const pct = (n) => (n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  const curto = (nome) => nome.split(" ").slice(0, 2).join(" ");

  // Cor fixa por número do candidato, igual nas duas abas, não importa quem está na frente
  const COR_FIXA = { 13: "var(--a)", 22: "var(--b)" }; // 13 = Lula (vermelho) · 22 = Flávio (azul)
  const corDe = (n, lista) => {
    if (COR_FIXA[Number(n)]) return COR_FIXA[Number(n)];
    const nums = lista.map((c) => Number(c.n)).sort((x, y) => x - y);
    return CORES[nums.indexOf(Number(n))] || "var(--sub)";
  };

  // Procura os candidatos em qualquer nível do arquivo (o formato do TSE muda de eleição para eleição)
  function acharCandidatos(obj, partido, lista, vistos) {
    if (Array.isArray(obj)) { obj.forEach((o) => acharCandidatos(o, partido, lista, vistos)); return; }
    if (!obj || typeof obj !== "object") return;
    if ("vap" in obj && (obj.nmu || obj.nm)) {
      if (!vistos.has(obj.n)) {
        vistos.add(obj.n);
        lista.push({ n: obj.n, nome: obj.nmu || obj.nm, partido, sq: obj.sqcand, votos: num(obj.vap), p: num(obj.pvap), eleito: obj.e === "s" || obj.e === "S" });
      }
      return;
    }
    const sg = obj.sg || partido;
    for (const k in obj) if (typeof obj[k] === "object") acharCandidatos(obj[k], sg, lista, vistos);
  }

  function ler(d) {
    const cargo = Array.isArray(d.carg) ? (d.carg.find((c) => String(c.cd) === "1") || d.carg) : d.carg || d;
    const lista = [];
    acharCandidatos(cargo, "", lista, new Set());
    lista.sort((x, y) => y.votos - x.votos);
    return { lista, s: d.s || {}, e: d.e || {}, v: d.v || {}, pst: num((d.s || {}).pst ?? d.pst) };
  }

  let usarProxy = false;
  async function buscar(uf) {
    const opc = { cache: "no-store" };
    const direto = `${BASE}/dados/${uf}/${uf}-c0001-e${COD}-u.json`;
    const proxy = `/api/apuracao?eleicao=${ELEICAO}&uf=${uf}`;
    if (!usarProxy) {
      try {
        const r = await fetch(direto + "?t=" + Date.now(), opc);
        if (r.ok) return r.json();
        if (r.status === 404) throw new Error("O TSE ainda não liberou os resultados.");
      } catch (e) {
        if (e.message.startsWith("O TSE")) throw e;
        usarProxy = true; // navegador bloqueou: tenta pelo servidor da Vercel
      }
    }
    const r = await fetch(proxy + "&t=" + Date.now(), opc);
    if (r.status === 404) throw new Error("O TSE ainda não liberou os resultados.");
    if (!r.ok) throw new Error("Falha ao buscar dados (" + r.status + ").");
    return r.json();
  }

  // ---------- Aba Brasil ----------
  let nacional = [];
  let ultimaHora = "";

  function desenharBrasil(d) {
    const { lista, s, e, v, pst } = ler(d);
    nacional = lista;
    $("pst").textContent = pct(pst);
    $("pstBar").style.width = Math.min(pst, 100) + "%";
    $("secoes").textContent = s.st ? `${fmt(num(s.st))} de ${fmt(num(s.ts))} seções totalizadas` : "";

    $("cands").innerHTML = lista.length ? lista.map((c) => `
      <div class="cand">
        <img class="foto" alt="" src="${c.sq ? `${BASE}/fotos/br/${c.sq}.jpeg` : ""}" onerror="this.style.visibility='hidden'">
        <div>
          <div class="nome">${c.nome}${c.eleito ? '<span class="eleito">ELEITO</span>' : ""}</div>
          <div class="partido">${c.n ? c.n + " · " : ""}${c.partido}</div>
        </div>
        <div>
          <div class="pct">${pct(c.p)}</div>
          <div class="votos">${fmt(c.votos)} votos</div>
        </div>
        <div class="cbar"><div style="width:${Math.min(c.p, 100)}%;background:${corDe(c.n, lista)}"></div></div>
      </div>`).join("") : '<div class="sub">Sem candidatos no arquivo ainda.</div>';

    $("vv").textContent = fmt(num(v.vv));
    $("vb").textContent = fmt(num(v.vb)) + (v.pvb ? " (" + pct(num(v.pvb)) + ")" : "");
    $("vn").textContent = fmt(num(v.tvn ?? v.vn)) + (v.ptvn ? " (" + pct(num(v.ptvn)) + ")" : "");
    $("te").textContent = fmt(num(e.te));
    $("c").textContent = fmt(num(e.c));
    $("a").textContent = fmt(num(e.a)) + (e.pa ? " (" + pct(num(e.pa)) + ")" : "");

    const finalizado = d.tf === "s" || d.md === "e";
    ultimaHora = [d.dg, d.hg].filter(Boolean).join(" às ");
    $("status").innerHTML = finalizado
      ? `<b>Apuração encerrada</b>${ultimaHora ? " · " + ultimaHora : ""}`
      : `<span class="dot"></span>Ao vivo${ultimaHora ? " · TSE atualizou em " + ultimaHora : ""}`;
  }

  // ---------- Aba Por estado ----------
  const estados = {}; // uf -> { lista, pst, te } ou { erro }

  async function buscarEstados() {
    const ufs = Object.keys(ESTADOS);
    // 6 de cada vez para não sobrecarregar
    for (let i = 0; i < ufs.length; i += 6) {
      await Promise.all(ufs.slice(i, i + 6).map(async (uf) => {
        try {
          const r = ler(await buscar(uf));
          estados[uf] = { lista: r.lista, pst: r.pst, te: num(r.e.te), st: num(r.s.st), ts: num(r.s.ts) };
        } catch (e) {
          if (!estados[uf]) estados[uf] = { erro: true };
        }
      }));
      desenharEstados();
      desenharRegioes();
    }
  }

  // ---------- Aba Por região (soma dos estados) ----------
  function desenharRegioes() {
    const refs = nacional.length ? nacional : (Object.values(estados).find((x) => x.lista?.length)?.lista || []);
    $("regioes").innerHTML = Object.entries(REGIOES).map(([nome, ufs]) => {
      const votos = {}, cands = {};
      let st = 0, ts = 0, carregados = 0;
      ufs.forEach((uf) => {
        const x = estados[uf];
        if (!x || !x.lista) return;
        carregados++;
        st += x.st; ts += x.ts;
        x.lista.forEach((c) => { votos[c.n] = (votos[c.n] || 0) + c.votos; cands[c.n] = c; });
      });
      const siglas = ufs.map((u) => u.toUpperCase()).join(" · ");
      const cabeca = `<div class="uf-top"><span class="reg-nome">${nome}</span>
        <span class="uf-apur">${ts ? pct((st / ts) * 100) + " apuradas" : ""}</span></div>
        <div class="reg-ufs">${siglas}${carregados < ufs.length ? ` · ${carregados} de ${ufs.length} estados com dados` : ""}</div>`;
      const total = Object.values(votos).reduce((s, v) => s + v, 0);
      if (!total) return `<div class="reg">${cabeca}<div class="uf-sem">${carregados ? "Sem votos apurados ainda" : "Carregando…"}</div></div>`;

      const porNumero = Object.keys(votos).map((n) => ({ ...cands[n], votos: votos[n], p: (votos[n] / total) * 100 }))
        .sort((a, b) => Number(a.n) - Number(b.n));
      const lider = porNumero.slice().sort((a, b) => b.votos - a.votos);
      const dif = lider.length > 1 ? lider[0].votos - lider[1].votos : 0;
      return `<div class="reg">${cabeca}
        <div class="split">${porNumero.map((c) => `<div style="width:${c.p}%;background:${corDe(c.n, refs.length ? refs : porNumero)}"></div>`).join("")}</div>
        <div class="reg-cands">${porNumero.map((c) => `<div><span>${curto(c.nome)}</span><b>${pct(c.p)}</b><span>${fmt(c.votos)} votos</span></div>`).join("")}</div>
        ${dif ? `<div class="reg-dif">${curto(lider[0].nome)} na frente por <b>${fmt(dif)}</b> votos</div>` : ""}
      </div>`;
    }).join("");
  }

  function desenharEstados() {
    const refs = nacional.length ? nacional : (Object.values(estados).find((x) => x.lista?.length)?.lista || []);
    const ordem = $("ordem").value;
    const linhas = Object.keys(ESTADOS).map((uf) => {
      const x = estados[uf] || {};
      const lista = (x.lista || []).slice().sort((a, b) => b.votos - a.votos);
      const dif = lista.length > 1 ? lista[0].p - lista[1].p : 999;
      return { uf, nome: ESTADOS[uf], lista, pst: x.pst || 0, te: x.te || 0, dif, carregado: !!x.lista, erro: x.erro };
    });
    const cmp = {
      eleitores: (a, b) => b.te - a.te || a.nome.localeCompare(b.nome),
      nome: (a, b) => a.nome.localeCompare(b.nome),
      diferenca: (a, b) => a.dif - b.dif,
      apuradas: (a, b) => b.pst - a.pst,
    }[ordem];
    linhas.sort(cmp);

    // Placar: em quantos estados cada candidato está na frente
    const vence = {};
    linhas.forEach((l) => { if (l.lista.length && l.lista[0].votos > 0) vence[l.lista[0].n] = (vence[l.lista[0].n] || 0) + 1; });
    $("placar").innerHTML = refs.length
      ? refs.slice().sort((a, b) => Number(a.n) - Number(b.n)).map((c) => `
          <div style="border-color:${corDe(c.n, refs)}">
            <b>${vence[c.n] || 0}</b><span>estados com ${curto(c.nome)} na frente</span>
          </div>`).join("")
      : '<span class="sub">Carregando estados…</span>';

    $("ufs").innerHTML = linhas.map((l) => {
      const cabeca = `<div class="uf-top"><span class="uf-nome">${l.nome}<small>${l.uf.toUpperCase()}</small></span>
        <span class="uf-apur">${l.carregado ? pct(l.pst) + " apuradas" : ""}</span></div>`;
      if (!l.carregado) return `<div class="uf">${cabeca}<div class="uf-sem">${l.erro ? "Sem dados ainda" : "Carregando…"}</div></div>`;
      const porNumero = l.lista.slice().sort((a, b) => Number(a.n) - Number(b.n));
      const total = porNumero.reduce((s, c) => s + c.p, 0) || 1;
      return `<div class="uf">${cabeca}
        <div class="split">${porNumero.map((c) => `<div style="width:${(c.p / total) * 100}%;background:${corDe(c.n, refs.length ? refs : porNumero)}"></div>`).join("")}</div>
        <div class="uf-pcts">${porNumero.map((c) => `<span>${curto(c.nome)} <b>${pct(c.p)}</b></span>`).join("")}</div>
      </div>`;
    }).join("");
  }

  // ---------- Abas e relógio ----------
  let aba = "br";
  function trocarAba(nova) {
    aba = nova;
    $("abaBr").classList.toggle("ativa", aba === "br");
    $("abaUf").classList.toggle("ativa", aba === "uf");
    $("abaReg").classList.toggle("ativa", aba === "reg");
    $("telaBr").hidden = aba !== "br";
    $("telaUf").hidden = aba !== "uf";
    $("telaReg").hidden = aba !== "reg";
    atualizar();
  }
  $("abaBr").onclick = () => trocarAba("br");
  $("abaUf").onclick = () => trocarAba("uf");
  $("abaReg").onclick = () => trocarAba("reg");
  $("ordem").onchange = desenharEstados;

  let restante = INTERVALO_BR;
  let ocupado = false;
  async function atualizar() {
    if (ocupado) return;
    ocupado = true;
    restante = aba === "br" ? INTERVALO_BR : INTERVALO_UF;
    try {
      desenharBrasil(await buscar("br"));
      if (aba !== "br") await buscarEstados();
    } catch (err) {
      $("status").innerHTML = `<span class="erro">${err.message}</span>${ultimaHora ? " · último dado: " + ultimaHora : ""}`;
    }
    ocupado = false;
  }

  $("agora").onclick = atualizar;
  setInterval(() => {
    restante -= 1;
    if (restante <= 0) atualizar();
    $("conta").textContent = Math.max(restante, 0);
  }, 1000);
  atualizar();
</script>
